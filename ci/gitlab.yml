image: python:3.11-bookworm
check:
  variables:
    TMPDIR: $CI_PROJECT_DIR/.ci-work/tmp
    UNBAKE_CONFIG: $CI_PROJECT_DIR/.ci-work/unbake.toml
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends binutils-mips-linux-gnu build-essential ripgrep git
    - ci/setup "$CI_PROJECT_DIR/.ci-work"
  script:
    - ci/check
