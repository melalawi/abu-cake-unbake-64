[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unbake"
version = "0.1.0"
description = "Standalone N64 decompilation builds and matching"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.13"
dependencies = [
  "click==8.5.0", "jsonschema==4.26.0", "abucache @ https://github.com/melalawi/abu-cache-64/releases/download/v0.2.1/abucache-0.2.1-py3-none-any.whl", "psutil==7.2.2", "pyelftools==0.33",
  "tomlkit==0.15.1", "PyYAML==6.0.3", "rabbitizer==1.16.2", "pycparser==3.0",
]

[project.scripts]
unbake = "unbake.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.16.9", "mypy==2.3.1", "pytest", "pytest-xdist==3.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["unbake", "unbake.*"]

[tool.setuptools.package-data]
"unbake" = ["resources/**/*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/unbake/cli.py" = ["T20"]
"cutover/*" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
