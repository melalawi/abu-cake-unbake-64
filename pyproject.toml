[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unbake"
version = "0.1.0"
description = "Standalone N64 decompilation builds and matching"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.11"
# n64link (AbuMasN64) 0.3.1 is pinned in buildfiles.N64LINK_RELEASE.
dependencies = ["pycparser==3.00", "toml==0.10.2", "rich==15.0.0", "questionary==2.1.1", "watchfiles==1.3.0"]

[project.scripts]
unbake = "unbake.cli.main:main"

[project.optional-dependencies]
dev = ["ruff==0.16.9", "mypy==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["unbake", "unbake.*"]

[tool.setuptools.package-data]
"unbake.compilers" = ["registry.toml"]
"unbake.templates" = ["*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/unbake/tui/**" = ["T20"]
"src/unbake/cli/output.py" = ["T20"]
"tests/fixture/make_rom.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
