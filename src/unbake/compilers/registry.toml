# Linux x86_64 compiler registry. Fetched and measured 2026-10-01.
# Downloads are pinned by archive and installed file SHA-256.
# KMC and SN64 assets are content-pinned despite mutable release labels.
# SN64 cc1 is the native mips-nintendo-nu64 build, not cc1n64.exe.
# Flag probes extend project cflags; [] always measures the project baseline.
# Tested against the pinned binaries with an integer loop, char load, double
# arithmetic and calls. --help is rejected by all four historical compilers.
# IDO accepts -O1/-O2/-O3; it rejects the GCC -f* and -mgp*/-mfp* probes below
# as malformed or unknown options. GCC accepts every listed variant and its
# output assembles with the project's GNU MIPS assembler.
# -mgp64 -mfp64 also compiles, but changes the N64 project's GP32 calling ABI;
# it is deliberately excluded from matching probes. -fno-defer-pop is accepted
# by GCC but does not change this MIPS sample (there is no callee-pop ABI).

[build_aliases]
sn64_asflags = "gnu_asflags"

