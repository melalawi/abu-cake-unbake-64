# Fingerprints calibrated using the exact compiler pins and baseline flags above.
# These features rank evidence; they do not certify a release or infer source.
# Frame epilogues were compared on loop/saved exemplars; flag changes may change
# scheduling. IDO releases share these exemplars and deliberately remain tied.
[fingerprint_policy]
schema = 1
minimum_moves = 8
agreement_numerator = 4
agreement_denominator = 5
rank = ["exclusive_exemplars", "matching_exemplars", "feature_agreement", "negative_contradictions"]

