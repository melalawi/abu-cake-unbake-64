# unbake host config: machine facts only. Every key is required by the commands that use it;
# a missing one is refused by name. Uncomment each line and set it for this machine.
# Read from --config FILE, then $UNBAKE_CONFIG, then ~/.config/unbake/unbake.toml.

[resources]
# Choose explicitly: run this command alone, or use a shared broker manifest.
# domain = "standalone"
# domain = "/abs/resource-domain.toml" # same manifest for commands sharing one allocation
# These bound this command's pool and make jobs; in broker mode they request an atomic grant.
# cores = 12
# workers = 8                       # unset: the core count; 1 is refused when cores > 1
# memory_total_bytes = 16000000000
# memory_parent_bytes = 4000000000
# memory_worker_bytes = 1500000000

[cache]
# machine_root = "/abs/machine-cache"   # machine-wide: compilers and search scratch; each project keeps its own cache in .unbake/cache
# max_bytes = 80000000000
# trim_to_bytes = 60000000000
# memory_bytes = 2000000000

[tools]
# make = "/usr/bin/make"
# path = ["/abs/toolbin"]          # the only PATH for make check; it must not contain python
# cpp = "/usr/bin/cpp"
# mips_as = "/usr/bin/mips-linux-gnu-as"
# mips_ld = "/usr/bin/mips-linux-gnu-ld"
# mips_objcopy = "/usr/bin/mips-linux-gnu-objcopy"
# mips_objdump = "/usr/bin/mips-linux-gnu-objdump"
# mips_readelf = "/usr/bin/mips-linux-gnu-readelf"
# n64link = "/abs/bin/n64link"
# splat = "/abs/venv/bin/splat"
# m2c = "/abs/venv/bin/m2c"
# permuter_archive = "/abs/decomp-permuter.tar.gz"
# permuter_sha256 = "<64 hex digits>"

[setup]
# version_jobs = 2
# probe_count = 8
# same_game_similarity = 0.9
# symbol_similarity_threshold = 0.9
# symbol_similarity_margin = 0.05

[search]
# frontier = 8 # minimum 4
# episode_recipes = 8
# episode_parents = 4
# no_gain_probes = 32 # per attempt; cached pairs do not count

[budgets]
# What a step chain may cost on this machine; a project's .unbake/unbake.toml may set its own.
# Over budget is reported by name on the step and in its JSON line on stderr.
# The verdict is CPU time; a wall-time miss while other processes keep contended_cores busy is reported as
# contended, not a failure.
# recompute_seconds = 450          # wall: a forced chain (recompute)
# unchanged_seconds = 30           # wall: an unforced chain in which no step ran
# changed_seconds = 90             # wall: an unforced chain in which a step ran
# recompute_cpu_seconds = 3000     # CPU (this process, its tools and its workers) of a forced chain
# unchanged_cpu_seconds = 60
# changed_cpu_seconds = 300
# step_cpu_seconds = 2000          # CPU of any one step
# main_cpu_seconds = 60            # a step's own-process CPU past which main_cpu_fraction applies
# main_cpu_fraction = 0.5          # a step's own-process share of its CPU: above it is a single-core stretch
# contended_cores = 2              # other processes' average cores that make a wall miss contended
# facts_miss_fraction = 0.01       # source units extracted of all, in an unforced solve
# main_rss_bytes = 8000000000      # one step's peak resident memory of this process
# worker_rss_bytes = 1500000000    # one step's peak resident memory of a pool worker

[cycle]
# min_bytes = 16
# max_bytes = 4096
# min_history = 5
# debounce_ms = 300
# search_seconds = 60              # one search method's time for a function the draft left short

[publish]
# branch = "main"
# author_name = "Your Name"
# author_email = "you@example.com"
