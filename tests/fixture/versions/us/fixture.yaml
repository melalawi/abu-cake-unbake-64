name: Synthetic fixture
options:
  basename: fixture
  target_path: ../../roms/baserom.us.z64
  base_path: ../..
  platform: n64
  compiler: IDO
  asm_path: asm/us
  src_path: src
  build_path: build/us
  symbol_addrs_path: versions/us/symbol_addrs.txt
  ld_script_path: build/us/fixture.ld
  find_file_boundaries: False
segments:
  - [0x0, header, header]
  - name: main
    type: code
    start: 0x40
    vram: 0x80001000
    subalign: 4
    subsegments:
      - [0x40, asm, alpha]
      - [0x4C, asm, beta]
      - [0x58, asm, gamma]
  - [0x64]
