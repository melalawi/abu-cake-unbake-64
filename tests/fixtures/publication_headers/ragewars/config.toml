[build]
asflags = [ "-march=vr4300", "-mabi=32", "-EB", "--no-pad-sections",]
cppflags = [ "-P", "-undef", "-nostdinc", "-D_LANGUAGE_C", "-DF3DEX_GBI_2", "-D__GNUC__=2",]
sn64_asflags = [ "-mips3",]

[version.eu-x]
baserom = "roms/baserom.eu-x.z64"
baserom_sha1 = "0b54615930a55675955eef8d8a22f1dfc34d2b44"
split = "versions/eu-x/RageWars.yaml"
symbols = "versions/eu-x/symbol_addrs.txt"
macros = [ "VERSION_EU_X",]
cartridge_id = "NUS-NRWX-0"
region = "Europe"
description = "PAL multi-language release."

[version.us-rev1]
baserom = "roms/baserom.us-rev1.z64"
baserom_sha1 = "037fb397cee2669048ed6b762a64698de4a4d88a"
split = "versions/us-rev1/RageWars.yaml"
symbols = "versions/us-rev1/symbol_addrs.txt"
macros = [ "VERSION_US_REV1",]
cartridge_id = "NUS-NRWE-1"
region = "North America"
description = "Revised NTSC release (grey cartridge)."

[compilers."gcc-2.8.1-sn64"]
cflags = [ "-G0", "-mips3", "-O2", "-mgas", "-meb", "-mcpu=VR4300", "-mhard-float", "-mgp32", "-mfp64", "-mno-fix4300",]

